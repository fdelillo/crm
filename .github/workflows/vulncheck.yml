name: vulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: make vuln
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # No cache: with the same paths as ci.yml the cache key would be the same, and this short job
      # could save it first, without the test build or golangci-lint (ADR-026 section 5).
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      # Fails closed (ADR-026 I-1): no continue-on-error and no `|| true`.
      - name: make vuln
        run: make vuln
