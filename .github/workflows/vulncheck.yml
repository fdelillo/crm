name: vulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: make vuln
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # No cache: with the same paths as ci.yml the cache key would be the same, and this short job
      # could save it first, without the test build or golangci-lint (ADR-026 section 5).
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      # Fails closed (ADR-026 I-1): no continue-on-error and no `|| true`.
      - name: make vuln
        run: make vuln

  npm-audit:
    name: make web-vuln
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # No cache and no `npm ci`: npm audit reads package-lock.json, so no third-party install
      # script runs in this job (ADR-027 section 5 and I-3).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false

      # Fails closed (ADR-027 I-1): no continue-on-error and no `|| true`.
      - name: make web-vuln
        run: make web-vuln
